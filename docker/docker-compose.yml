services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aniflow
      POSTGRES_PASSWORD: aniflow
      POSTGRES_DB: aniflow
    ports:
      - "5432:5432"
    volumes:
      - aniflow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aniflow"]
      interval: 5s
      timeout: 5s
      retries: 8

  backend:
    build: ./backend
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:-change-me-in-compose}
      DATABASE_URL: postgresql+psycopg://aniflow:aniflow@db:5432/aniflow
      STORAGE_DIR: /app/storage
      SEED_ON_STARTUP: "true"
      DEMO_PASSWORD: demo1234
      AI_PROVIDER: mock
      AI_API_KEY: ${AI_API_KEY:-}
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173
    volumes:
      - aniflow_files:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  aniflow_pg:
  aniflow_files:
